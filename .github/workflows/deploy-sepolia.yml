name: deploy-sepolia

on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Verify the deployed contract on Etherscan"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sepolia
    defaults:
      run:
        working-directory: contracts
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install https://github.com/foundry-rs/forge-std --no-commit

      - name: Preflight
        shell: bash
        run: |
          test -n "$SEPOLIA_RPC_URL" || { echo "SEPOLIA_RPC_URL is not configured."; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY is not configured."; exit 1; }
          if [ "${{ inputs.verify }}" = "true" ]; then
            test -n "$ETHERSCAN_API_KEY" || { echo "ETHERSCAN_API_KEY is not configured."; exit 1; }
          fi

      - name: Dry-run deployment
        run: forge script script/DeployGapWitness.s.sol:DeployGapWitness --rpc-url "$SEPOLIA_RPC_URL"

      - name: Broadcast deployment
        run: forge script script/DeployGapWitness.s.sol:DeployGapWitness --rpc-url "$SEPOLIA_RPC_URL" --private-key "$PRIVATE_KEY" --broadcast

      - name: Record deployment
        run: |
          python ../scripts/record_sepolia_deployment.py \
            --broadcast broadcast/DeployGapWitness.s.sol/11155111/run-latest.json \
            --output deployments/sepolia.json \
            --deployment-commit "$GITHUB_SHA"
        shell: bash

      - name: Verify deployed contract
        if: ${{ inputs.verify }}
        run: |
          ADDRESS=$(python ../scripts/read_sepolia_deployment.py --deployment deployments/sepolia.json)
          forge verify-contract \
            "$ADDRESS" \
            src/GapWitness.sol:GapWitness \
            --chain sepolia \
            --etherscan-api-key "$ETHERSCAN_API_KEY" \
            --watch

      - name: Mark deployment verified
        if: ${{ inputs.verify && success() }}
        run: |
          python ../scripts/record_sepolia_deployment.py \
            --broadcast broadcast/DeployGapWitness.s.sol/11155111/run-latest.json \
            --output deployments/sepolia.json \
            --deployment-commit "$GITHUB_SHA" \
            --verified

      - name: Publish deployment summary
        if: ${{ always() }}
        working-directory: .
        shell: bash
        run: |
          if [ -f contracts/deployments/sepolia.json ]; then
            echo "## GapWitness Sepolia deployment" >> "$GITHUB_STEP_SUMMARY"
            cat contracts/deployments/sepolia.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deployment record was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deployment record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gapwitness-sepolia-deployment
          path: contracts/deployments/sepolia.json
          if-no-files-found: warn
