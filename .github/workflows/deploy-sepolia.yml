name: deploy-sepolia

on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Verify the deployed contract on Etherscan"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sepolia
    defaults:
      run:
        working-directory: contracts
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install https://github.com/foundry-rs/forge-std --no-commit

      - name: Preflight
        shell: bash
        run: |
          test -n "$SEPOLIA_RPC_URL" || { echo "SEPOLIA_RPC_URL is not configured."; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY is not configured."; exit 1; }
          if [ "${{ inputs.verify }}" = "true" ]; then
            test -n "$ETHERSCAN_API_KEY" || { echo "ETHERSCAN_API_KEY is not configured."; exit 1; }
          fi

      - name: Dry-run deployment
        run: forge script script/DeployGapWitness.s.sol:DeployGapWitness --rpc-url "$SEPOLIA_RPC_URL"

      - name: Broadcast and verify
        if: ${{ inputs.verify }}
        run: forge script script/DeployGapWitness.s.sol:DeployGapWitness --rpc-url "$SEPOLIA_RPC_URL" --private-key "$PRIVATE_KEY" --broadcast --verify --etherscan-api-key "$ETHERSCAN_API_KEY"

      - name: Broadcast without verification
        if: ${{ !inputs.verify }}
        run: forge script script/DeployGapWitness.s.sol:DeployGapWitness --rpc-url "$SEPOLIA_RPC_URL" --private-key "$PRIVATE_KEY" --broadcast
