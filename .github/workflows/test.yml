name: test

on:
  push:
  pull_request:

concurrency:
  group: gapwitness-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/test_record_sepolia_deployment.py

  checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python ../scripts/test_prepare_chain_demo.py
      - run: python -m pytest -q ../scripts/test_fixture_proof.py
      - run: python -m pytest -q ../scripts/test_check_release.py ../scripts/test_check_submission.py
      - run: python demo/run_demo.py
      - name: Build checker container
        run: docker build -f Dockerfile -t gapwitness-checker-ci ..
      - name: Reproduce the retained witness inside the built container
        run: |
          docker run --rm -e PYTHONPATH=/app \
            -v "$PWD/../scripts/check_container_fixture.py:/fixture-check.py:ro" \
            -v "$PWD/demo/file_a.csv:/fixture.csv:ro" \
            -v "$PWD/../contracts/deployments/fixture-proof-v2.json:/expected.json:ro" \
            gapwitness-checker-ci python /fixture-check.py /fixture.csv /expected.json

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge install https://github.com/foundry-rs/forge-std --no-git
      - run: forge build
      - run: forge test -vv
