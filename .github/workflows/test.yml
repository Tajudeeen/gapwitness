name: test

on:
  push:
  pull_request:

concurrency:
  group: gapwitness-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python demo/run_demo.py
      - name: Build checker container
        run: docker build -f Dockerfile ..

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge install https://github.com/foundry-rs/forge-std --no-commit
      - run: forge build
      - run: forge test -vv
