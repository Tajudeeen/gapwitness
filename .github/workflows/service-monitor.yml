name: service-monitor
on:
  push:
    paths:
      - 'checker/**'
      - 'scripts/monitor_service.py'
      - 'scripts/verify_real_corpus.py'
      - 'data/corpus/**'
      - '.github/workflows/service-monitor.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gapwitness-service-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r checker/requirements.txt
      - run: python scripts/monitor_service.py --output /tmp/gapwitness-monitor.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gapwitness-monitor-${{ github.run_id }}
          path: /tmp/gapwitness-monitor.json
          retention-days: 14
