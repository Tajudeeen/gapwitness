name: web

on:
  push:
  pull_request:

concurrency:
  group: gapwitness-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r checker/requirements.txt
      - run: npm ci
        working-directory: web
      - name: Select installed Chrome or install Playwright Chromium
        timeout-minutes: 5
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: web
      - run: npm run test:browser
        working-directory: web
        env:
          VITE_CONTRACT_V2: '0x2222222222222222222222222222222222222222'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: web/test-results
