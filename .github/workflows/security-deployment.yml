name: security-deployment
on:
  create:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gapwitness-security-deployment
  cancel-in-progress: false
jobs:
  deploy-v2:
    if: github.actor == 'Tajudeeen' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'security-run/'))
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -r checker/requirements.txt
      - name: Configure public Sepolia fallback
        run: |
          test -n "$PRIVATE_KEY" || { echo 'PRIVATE_KEY is not configured'; exit 1; }
          if [ -z "$SEPOLIA_RPC_URL" ]; then
            echo 'SEPOLIA_RPC_URL=https://ethereum-sepolia-rpc.publicnode.com' >> "$GITHUB_ENV"
          fi
      - name: Test publisher isolation and immutable evidence
        working-directory: contracts
        run: |
          forge install https://github.com/foundry-rs/forge-std --no-git
          forge test -vv
      - name: Deploy publisher-scoped contract
        working-directory: contracts
        run: |
          forge script script/DeployGapWitnessV2.s.sol:DeployGapWitnessV2 --rpc-url "$SEPOLIA_RPC_URL" --private-key "$PRIVATE_KEY" --gas-estimate-multiplier 300 --broadcast
          python ../scripts/record_sepolia_deployment.py --contract-name GapWitnessV2 \
            --broadcast broadcast/DeployGapWitnessV2.s.sol/11155111/run-latest.json \
            --output deployments/sepolia-v2.json --deployment-commit "$GITHUB_SHA"
      - name: Prove source fixture and publisher isolation
        run: python scripts/prove_v2_onchain.py
      - uses: actions/upload-artifact@v4
        with:
          name: gapwitness-v2-security-proof
          path: |
            contracts/deployments/sepolia-v2.json
            contracts/deployments/fixture-proof-v2.json
      - name: Publish proven deployment and web configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "ops/v2-security-proof-${GITHUB_RUN_ID}"
          git add contracts/deployments/sepolia-v2.json contracts/deployments/fixture-proof-v2.json web/src/lib/deployment.ts
          git commit -m 'Record proven publisher-scoped Sepolia deployment'
          git push origin HEAD
