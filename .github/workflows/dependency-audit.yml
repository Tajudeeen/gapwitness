name: dependency-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gapwitness-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit locked production and development dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-security-audit
          path: web/npm-audit.json
          retention-days: 14
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: checker/requirements.txt
