name: dependency-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gapwitness-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit locked production and development dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Explain dependency audit failures
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          if (existsSync('npm-audit.json')) {
            const report=JSON.parse(readFileSync('npm-audit.json','utf8'));
            for (const [name,record] of Object.entries(report.vulnerabilities??{})) {
              console.log(JSON.stringify({name,severity:record.severity,range:record.range,fixAvailable:record.fixAvailable,
                advisories:record.via.filter(item=>typeof item==='object').map(item=>({title:item.title,url:item.url,range:item.range}))}));
            }
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-security-audit
          path: web/npm-audit.json
          retention-days: 14
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: checker/requirements.txt
