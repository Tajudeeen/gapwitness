name: final-evidence
on:
  workflow_dispatch:
  create:
permissions:
  contents: write
concurrency:
  group: gapwitness-final-evidence
  cancel-in-progress: false
jobs:
  fixture-proof:
    if: github.actor == 'Tajudeeen' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'proof-run/'))
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -r checker/requirements.txt
      - run: python -m pytest checker/tests scripts/test_fixture_proof.py
        env:
          PYTHONPATH: checker
      - name: Commit source fixture and verify changed-file rejection
        run: python scripts/prove_fixture_onchain.py
      - uses: actions/upload-artifact@v7
        with:
          name: gapwitness-fixture-proof
          path: contracts/deployments/fixture-proof.json
      - name: Publish proof branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "ops/fixture-proof-${GITHUB_RUN_ID}"
          git add contracts/deployments/fixture-proof.json
          git commit -m 'Record independently verified environmental fixture proof'
          git push origin HEAD
  explorer-verification:
    if: github.actor == 'Tajudeeen' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'proof-run/'))
    runs-on: ubuntu-latest
    environment: sepolia
    env:
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Select the current deployment record
        run: |
          if [ -f deployments/sepolia-v2.json ]; then
            echo 'DEPLOYMENT_RECORD=deployments/sepolia-v2.json' >> "$GITHUB_ENV"
          else
            echo 'DEPLOYMENT_RECORD=deployments/sepolia.json' >> "$GITHUB_ENV"
          fi
      - name: Prepare the exact deployment source and compiler input
        run: |
          ADDRESS=$(python ../scripts/read_sepolia_deployment.py --deployment "$DEPLOYMENT_RECORD")
          SOURCE_COMMIT=$(python -c 'import json,os; print(json.load(open(os.environ["DEPLOYMENT_RECORD"]))["deploymentCommit"])')
          CONTRACT_NAME=$(python -c 'import json,os; print(json.load(open(os.environ["DEPLOYMENT_RECORD"]))["contract"])')
          echo "VERIFICATION_CONTRACT=$CONTRACT_NAME" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/gapwitness-deployed-source "$SOURCE_COMMIT"
          cd /tmp/gapwitness-deployed-source/contracts
          forge install https://github.com/foundry-rs/forge-std --no-git
          forge build
          forge verify-contract "$ADDRESS" "src/${CONTRACT_NAME}.sol:${CONTRACT_NAME}" \
            --chain sepolia --compiler-version 0.8.24 --show-standard-json-input \
            > verification-input.json
      - uses: actions/upload-artifact@v7
        with:
          name: gapwitness-explorer-source-input
          path: /tmp/gapwitness-deployed-source/contracts/verification-input.json
      - name: Verify the existing deployment, without redeploying
        run: |
          test -n "$ETHERSCAN_API_KEY" || { echo 'ETHERSCAN_API_KEY is not configured.'; exit 1; }
          ADDRESS=$(python ../scripts/read_sepolia_deployment.py --deployment "$DEPLOYMENT_RECORD")
          cd /tmp/gapwitness-deployed-source/contracts
          forge verify-contract "$ADDRESS" "src/${VERIFICATION_CONTRACT}.sol:${VERIFICATION_CONTRACT}" \
            --chain sepolia --compiler-version 0.8.24 \
            --etherscan-api-key "$ETHERSCAN_API_KEY" --watch
      - name: Record successful explorer verification
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["DEPLOYMENT_RECORD"])
          data = json.loads(p.read_text())
          data['verified'] = True
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "ops/explorer-verification-${GITHUB_RUN_ID}"
          git add "$DEPLOYMENT_RECORD"
          git commit -m 'Record successful Etherscan source verification'
          git push origin HEAD
